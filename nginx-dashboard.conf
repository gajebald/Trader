server {
    listen 80;
    server_name _;  # greift für alle Hostnamen / IP-Adressen

    # Weiterleitung an das Flask-Dashboard
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # Statische Dateien direkt ausliefern (falls später hinzugefügt)
    location /static/ {
        alias /home/user/Trader/static/;
    }

    # Sicherheit: sensible Pfade sperren
    location ~ /\. {
        deny all;
    }
}
